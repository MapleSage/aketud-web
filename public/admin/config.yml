backend:
  name: github
  repo: MapleSage/aketud-web
  branch: main
  # Hosted auth: GitHub OAuth handled by this site's own Pages Functions
  # (functions/oauth/*). Needs GITHUB_CLIENT_ID / GITHUB_CLIENT_SECRET env vars
  # on the Pages project + a GitHub OAuth App with callback
  # https://www.aketud.com/oauth/callback
  base_url: https://www.aketud.com
  auth_endpoint: oauth/auth

# Local editing: `npx @sveltia/cms-proxy-server` + this flag, edit at
# http://localhost:4321/admin/ with no GitHub auth.
local_backend: true

media_folder: "public/uploads"
public_folder: "/uploads"

site_url: https://www.aketud.com
display_url: https://www.aketud.com
logo_url: /favicon-64.png

collections:
  # -------------------------------------------------------------- Settings
  - name: settings
    label: Site settings
    editor: { preview: false }
    files:
      - name: site
        label: Nav, footer & contact
        file: src/content/settings/site.json
        fields:
          - { name: org, label: Org name, widget: string }
          - { name: contactEmail, label: Contact email, widget: string }
          - { name: locations, label: Locations line, widget: string }
          - { name: address, label: Address, widget: string, required: false }
          - { name: logo, label: "Logo (light backgrounds)", widget: image, default: /aketud-logo.png }
          - { name: logoWhite, label: "Logo (dark backgrounds)", widget: image, default: /aketud-logo-white.png }
          - { name: postsPerPage, label: "Blog: posts per page", widget: number, value_type: int, min: 1, max: 50, default: 12 }
          - name: nav
            label: "Nav links (legacy flat nav)"
            widget: list
            fields: [{ name: label, widget: string }, { name: href, widget: string }]
          - { name: navCta, label: Nav button, widget: object, fields: [{ name: label, widget: string }, { name: href, widget: string }] }
          - name: menu
            label: "Mega-menu (item → group → link, up to 3 levels)"
            widget: list
            required: false
            fields:
              - { name: label, widget: string }
              - { name: href, widget: string, required: false }
              - name: children
                label: Groups
                widget: list
                default: []
                fields:
                  - { name: label, widget: string }
                  - { name: href, widget: string, required: false }
                  - name: children
                    label: Links
                    widget: list
                    default: []
                    fields: [{ name: label, widget: string }, { name: href, widget: string, required: false }]
          - name: footerLinks
            label: "Footer links (legacy)"
            widget: list
            fields: [{ name: label, widget: string }, { name: href, widget: string }]
          - name: footerColumns
            label: Footer columns
            widget: list
            required: false
            fields:
              - { name: heading, widget: string }
              - { name: href, label: "Heading link (leave empty for a plain heading)", widget: string, required: false }
              - name: links
                widget: list
                default: []
                fields: [{ name: label, widget: string }, { name: href, widget: string }]
          - name: social
            label: Social links
            widget: list
            required: false
            hint: "Icon SVGs aren't editable here — add a new platform's icon in src/content/settings/site.json directly, then edit its label/URL from this list."
            fields: [{ name: label, widget: string }, { name: href, widget: string }]

  # -------------------------------------------------------------- Products
  - name: products
    label: Product pages
    label_singular: Product
    folder: src/content/products
    create: false
    extension: json
    identifier_field: name
    sortable_fields: [order]
    fields:
      - { name: order, label: Order, widget: number, value_type: int }
      - { name: slug, label: "Slug (URL + subdomain)", widget: select, options: [platform, pas, uw, fnol, atlas] }
      - { name: no, label: Number label, widget: string, hint: "e.g. 01" }
      - { name: name, label: Name, widget: string }
      - { name: eyebrow, label: Eyebrow, widget: string, hint: "e.g. 01 — Operations Command Center" }
      - { name: domain, label: Domain, widget: string }
      - { name: sector, label: Sector line, widget: string }
      - { name: dark, label: Dark hero, widget: boolean, default: false }
      - { name: lead, label: Lead paragraph, widget: text }
      - { name: heroVideo, label: "Hero video (R2 base name)", widget: string, required: false }
      - { name: architecture, label: "How it's built (paragraphs)", widget: list, field: { name: para, label: Paragraph, widget: text } }
      - { name: stack, label: Stack chips, widget: list, field: { name: item, label: Item, widget: string } }
      - name: screens
        label: Screens
        widget: list
        fields:
          - { name: src, label: Image, widget: image, required: false, hint: "leave empty to show the placeholder slot" }
          - { name: alt, label: Alt text, widget: string }
          - { name: caption, label: Caption, widget: string }

  # ----------------------------------------------------------------- Pages
  - name: pages
    label: Pages
    editor: { preview: false }
    files:
      - name: home
        label: Homepage
        file: src/content/pages/insurance.json
        fields: &pillarFields
          - { name: metaTitle, label: SEO title, widget: string }
          - { name: metaDescription, label: SEO description, widget: text }
          - { name: eyebrow, label: Eyebrow, widget: string, required: false }
          - { name: title, label: Title, widget: text, required: false, hint: "line breaks = \\n" }
          - { name: intro, label: Intro, widget: text, required: false }
          - name: sections
            label: Section headers
            widget: list
            required: false
            fields:
              - { name: eyebrow, widget: string, required: false }
              - { name: heading, widget: string, required: false }
              - { name: body, widget: list, required: false, field: { name: para, widget: text } }
          - name: steps
            label: Steps / blocks
            widget: list
            required: false
            fields:
              - { name: heading, widget: string }
              - { name: body, widget: text }
          - name: stats
            label: Stats
            widget: list
            required: false
            fields:
              - { name: value, widget: string }
              - { name: label, widget: string }
          - name: prose
            label: "Long-form body (legal / policy pages)"
            widget: list
            required: false
            fields:
              - { name: heading, widget: string, required: false }
              - { name: body, widget: list, field: { name: para, widget: text } }
          - name: cta
            label: Closing CTA
            widget: object
            required: false
            fields:
              - { name: eyebrow, widget: string }
              - { name: line, widget: text }
              - { name: body, widget: text, required: false }
              - { name: button, widget: object, fields: [{ name: label, widget: string }, { name: href, widget: string }] }

      - name: adm
        label: "ADM (Application Development & Maintenance)"
        file: src/content/pages/adm.json
        fields: *pillarFields

      - name: digital
        label: "Insurance — Digital"
        file: src/content/pages/insurance-digital.json
        fields: *pillarFields

      - name: innovate
        label: "Insurance — Innovate"
        file: src/content/pages/insurance-innovate.json
        fields: *pillarFields

      - name: modernization
        label: "Insurance — Modernization"
        file: src/content/pages/insurance-modernization.json
        fields: *pillarFields

      - name: qa-testing
        label: "Insurance — QA & Testing"
        file: src/content/pages/insurance-qa-testing.json
        fields: *pillarFields

      - name: sageinsure
        label: "Insurance — Aketud AI"
        file: src/content/pages/insurance-sageinsure.json
        fields: *pillarFields

      - name: workplace-policy
        label: "Workplace Policy (legal)"
        file: src/content/pages/workplace-policy.json
        fields: *pillarFields
